[project]
name = "hospital-twin"
version = "0.1.0"
description = "AI-powered hospital digital twin: forecasting, simulation, optimisation and decision support"
authors = [
    { name = "Arnav717", email = "arnavkamramalout@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "holidays>=0.106",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.53.0",
    "simpy>=4.1.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.65.0",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hospital-twin = "hospital_twin:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
